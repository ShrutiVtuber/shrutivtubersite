<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>guide · sigil</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/overlay-guides.css">
</head>
<body>
<div class="gov" data-theme="almanac" data-motion="reduced">
  <div class="gov-sigil" data-sigil hidden><div class="ring" data-ring></div><span class="count" data-count></span></div>
  <div class="gov-plate gov-empty" data-empty>
    <span class="gov-eyebrow">Shruti's Guides</span>
    <span class="say">No run selected.</span>
  </div>
</div>
<script>
  const root = document.querySelector(".gov");
  const token = new URLSearchParams(location.search).get("t") || "";
  let last = { version: "", element: null };
  const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
  let still = false, reduced = false;
  const empty = root.querySelector("[data-empty]");
  const wait = (ms) => new Promise((r) => window.setTimeout(r, ms));
  const ring = root.querySelector("[data-ring]"), count = root.querySelector("[data-count]"), holder = root.querySelector("[data-sigil]");
  const arcD = (r, a0, a1) => { const R = (d) => ((d - 90) * Math.PI) / 180; const x0 = 50 + r * Math.cos(R(a0)), y0 = 50 + r * Math.sin(R(a0)), x1 = 50 + r * Math.cos(R(a1)), y1 = 50 + r * Math.sin(R(a1)); return `M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`; };
  const build = (parts) => { const stroke = Number(getComputedStyle(root).getPropertyValue("--gt-stroke")) || 12; const n = Math.max(1, parts.length), gap = Math.max(2, Math.min(8, 24 / n)), span = 360 / n, w = stroke * 0.5, r = 50 - w / 2 - 1; let out = "";
    parts.forEach((p, i) => { const a0 = i * span + gap / 2, a1 = (i + 1) * span - gap / 2; out += `<path d="${arcD(r, a0, a1)}" fill="none" stroke="var(--gt-faint)" stroke-opacity=".35" stroke-width="${w}"/>`; const pct = Math.max(0, Math.min(1, p.pct || 0)); out += `<path class="fill" pathLength="100" d="${arcD(r, a0, a1)}" fill="none" stroke="${p.state === "done" ? "var(--st-done)" : "var(--st-now)"}" stroke-width="${w}" style="stroke-dasharray:${(pct * 100).toFixed(1)} 100${pct <= 0.004 ? ";opacity:0" : ""}"/>`; });
    return `<svg viewBox="0 0 100 100" width="200" height="200" aria-hidden="true">${out}</svg>`; };
  const paint = (el) => { holder.hidden = !el; empty.hidden = !!el; if (!el) return; const fills = ring.querySelectorAll(".fill");
    if (fills.length === (el.parts ?? []).length && fills.length) { el.parts.forEach((p, i) => { const f = fills[i]; const pct = Math.max(0, Math.min(1, p.pct || 0)); f.setAttribute("stroke", p.state === "done" ? "var(--st-done)" : "var(--st-now)"); f.style.strokeDasharray = `${(pct * 100).toFixed(1)} 100`; f.style.opacity = pct <= 0.004 ? "0" : "1"; }); } else ring.innerHTML = build(el.parts ?? []);
    count.textContent = el.count ?? ""; };
  const draw = async (prev, next) => { const finished = prev && next && (prev.parts ?? []).filter((p) => p.state === "done").length < (next.parts ?? []).filter((p) => p.state === "done").length; paint(next); if (finished && !still && !reduced) { holder.classList.add("phase-done"); await wait(600); holder.classList.remove("phase-done"); } };
  const tick = async () => {
    if (!token) return;
    try {
      const r = await fetch(`/api/overlay/guide?t=${encodeURIComponent(token)}`, { cache: "no-store" });
      if (!r.ok) return;                       /* held, not blanked */
      const next = await r.json();
      root.dataset.theme = next.theme; root.dataset.motion = next.motion;
      still = next.motion === "still"; reduced = next.motion === "reduced";
      if (next.version !== last.version || (!last.element && next.element)) {
        await draw(last.element, next.element);
        last = { version: next.version, element: next.element };
      }
    } catch { /* offline: the last frame stands */ }
  };
  tick(); window.setInterval(tick, 2000);
</script>
</body>
</html>
