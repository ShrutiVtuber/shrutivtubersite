[project]
name = "shruti"
version = "0.1.0-dev"
description = "shrutivtuber.com backend — FastAPI, content model, live status"
requires-python = ">=3.12"
authors = [{ name = "Soror Eu. A." }]

dependencies = [
    "fastapi >=0.115,<1.0",
    "uvicorn[standard] >=0.32,<1.0",
    "httpx >=0.28,<1.0",
    # Passkeys. py_webauthn does the CBOR, the attestation parsing and the
    # signature checks — the parts of WebAuthn where writing it yourself means
    # writing a subtle authentication bug.
    "webauthn >=2.5,<4.0",
    "cbor2 >=5.6,<6.0",
    # Stripe. The webhook signature check is the security-critical part, and
    # hand-rolling HMAC comparison against a replay window is exactly the kind
    # of code that is subtly wrong and passes every happy-path test.
    "stripe >=11.0,<14.0",

    # Data layer — Postgres, not SQLite. Production standard.
    "sqlmodel >=0.0.22,<1.0",
    "alembic >=1.14,<2.0",
    "asyncpg >=0.30,<1.0",
    "greenlet >=3.1,<4.0",

    # Auth for the admin surface
    "argon2-cffi >=23.1,<25.0",
    "pyjwt[crypto] >=2.10,<3.0",
    "python-multipart >=0.0.20,<1.0",

    # Config + validation
    "pydantic >=2.10,<3.0",
    "pydantic-settings >=2.7,<3.0",
    "email-validator >=2.2,<3.0",
    # The guide format's validator (vendored package shrutisguides).
    "jsonschema >=4.23,<5.0",

    # Media handling (image dimensions, thumbnails)
    "pillow >=11.0,<12.0",

    # Markdown for editable body copy
    "markdown-it-py >=3.0,<4.0",
    "bleach >=6.2,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest >=8.3,<9.0",
    "pytest-asyncio >=0.25,<1.0",
    "ruff >=0.8,<1.0",
    "mypy >=1.14,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shruti", "shrutisguides", "shrutisguides.format"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"

# ⚠ The schema is data, not code; without this it is left out of the wheel
# and the validator fails only where it runs from site-packages — production.
[tool.setuptools.package-data]
"shrutisguides.format" = ["schema.json"]
