<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Astrolabe</title>
<link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;padding:0;width:1280px;height:854px;overflow:hidden}
.t{display:grid;grid-template-columns:1fr 320px;width:1280px;height:854px}
.m{background:#121829;display:grid;place-items:center}
.m span{font:500 168px/1 var(--font-display);color:#C9A15B;letter-spacing:-0.02em;white-space:nowrap}
.s{display:grid;grid-template-rows:repeat(4,1fr);height:854px}
.s i{display:block}</style></head>
<body><div class="t">
<div class="m"><span>Astrolabe</span></div>
<div class="s"><i style="background:#E0BE7E"></i><i style="background:#8FBEE8"></i><i style="background:#E0A4BC"></i><i style="background:#F07A8C"></i></div>
</div></body></html>
