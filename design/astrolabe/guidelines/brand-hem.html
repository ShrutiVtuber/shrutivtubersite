<!-- @dsCard group="Brand" viewport="700x150" name="The hem" subtitle="A gold edge-line that fades at both ends, as the cloak\u2019s trim does when the fabric turns." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--page);font-family:var(--font-body)}
.row{display:flex;gap:10px;flex-wrap:wrap}.col{display:grid;gap:10px}
.sw{border-radius:var(--radius-sm);border:1px solid var(--line);padding:10px;display:grid;gap:4px;min-width:96px;flex:1}
.hex{font:400 11px/1 var(--font-body);font-variant-numeric:tabular-nums;letter-spacing:.03em;color:var(--faint)}
.nm{font:600 11px/1.2 var(--font-body);color:var(--ink)}
.note{font:400 11px/1.5 var(--font-body);color:var(--faint)}
.tok{font:400 11px/1 var(--font-body);color:var(--faint);letter-spacing:.02em}
</style></head><body><div class="col" style="gap:12px">
<div class="hem" style="background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);padding:14px 16px"><span class="nm">.hem</span> <span class="hex">— one per screen, at the top of the brand surface</span></div>
<div class="hem hem-strong" style="background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);padding:14px 16px"><span class="nm">.hem-strong</span> <span class="hex">— the Masthead and the live banner</span></div>
<div class="hem hem-hour" data-hour="mars" style="background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);padding:14px 16px"><span class="nm">.hem-hour</span> <span class="hex">— takes the ruling hour; shown here in the hour of Mars</span></div>
</div></body></html>
