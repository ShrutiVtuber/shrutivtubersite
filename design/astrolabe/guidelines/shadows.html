<!-- @dsCard group="Brand" viewport="700x140" name="Elevation" subtitle="On a #121829 page shadow barely reads, so it is reserved for things that float." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--page);font-family:var(--font-body)}
.row{display:flex;gap:10px;flex-wrap:wrap}.col{display:grid;gap:10px}
.sw{border-radius:var(--radius-sm);border:1px solid var(--line);padding:10px;display:grid;gap:4px;min-width:96px;flex:1}
.hex{font:400 11px/1 var(--font-body);font-variant-numeric:tabular-nums;letter-spacing:.03em;color:var(--faint)}
.nm{font:600 11px/1.2 var(--font-body);color:var(--ink)}
.note{font:400 11px/1.5 var(--font-body);color:var(--faint)}
.tok{font:400 11px/1 var(--font-body);color:var(--faint);letter-spacing:.02em}
</style></head><body><div class="row">
<div style="flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);padding:14px;box-shadow:var(--shadow-1)"><span class="nm">--shadow-1</span><br><span class="hex">resting card</span></div><div style="flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);padding:14px;box-shadow:var(--shadow-2)"><span class="nm">--shadow-2</span><br><span class="hex">pressed, raised</span></div><div style="flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);padding:14px;box-shadow:var(--shadow-3)"><span class="nm">--shadow-3</span><br><span class="hex">sheets and dialogs</span></div>
</div><p class="note" style="margin:12px 0 0">Never a decorative glow. The only glow in the system is --glow-live, on the live dot.</p></body></html>
