<!-- @dsCard group="Colors" viewport="700x150" name="Accent — interactive" subtitle="Cold blue is the only colour that means "you can touch this"." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--page);font-family:var(--font-body)}
.row{display:flex;gap:10px;flex-wrap:wrap}.col{display:grid;gap:10px}
.sw{border-radius:var(--radius-sm);border:1px solid var(--line);padding:10px;display:grid;gap:4px;min-width:96px;flex:1}
.hex{font:400 11px/1 var(--font-body);font-variant-numeric:tabular-nums;letter-spacing:.03em;color:var(--faint)}
.nm{font:600 11px/1.2 var(--font-body);color:var(--ink)}
.note{font:400 11px/1.5 var(--font-body);color:var(--faint)}
.tok{font:400 11px/1 var(--font-body);color:var(--faint);letter-spacing:.02em}
</style></head><body><div class="row">
<div class="sw" style="background:#8FBEE8"><span class="nm" style="color:#10182B">--accent</span><span class="hex" style="color:#10182B;opacity:.8">#8FBEE8</span><span class="hex" style="color:#10182B;opacity:.65">links, selection, focus</span></div>
<div class="sw" style="background:#A9CDEF"><span class="nm" style="color:#10182B">--accent-hover</span><span class="hex" style="color:#10182B;opacity:.8">#A9CDEF</span><span class="hex" style="color:#10182B;opacity:.65">hover / pressed</span></div>
<div class="sw" style="background:#1D2A45"><span class="nm" style="color:#8FBEE8">--accent-wash</span><span class="hex" style="color:#8FBEE8;opacity:.8">#1D2A45</span><span class="hex" style="color:#8FBEE8;opacity:.65">today, selected row</span></div>
<div class="sw" style="background:#10182B"><span class="nm" style="color:#8FBEE8">--on-accent</span><span class="hex" style="color:#8FBEE8;opacity:.8">#10182B</span><span class="hex" style="color:#8FBEE8;opacity:.65">text on a filled button</span></div>
</div><p class="note" style="margin:10px 0 0">Gold is ornament and never interactive; blue is interactive and never ornament.</p></body></html>
