<!-- @dsCard group="Spacing" viewport="700x140" name="Touch targets" subtitle="Nothing interactive is smaller than 48px, whatever it looks like." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--page);font-family:var(--font-body)}
.row{display:flex;gap:10px;flex-wrap:wrap}.col{display:grid;gap:10px}
.sw{border-radius:var(--radius-sm);border:1px solid var(--line);padding:10px;display:grid;gap:4px;min-width:96px;flex:1}
.hex{font:400 11px/1 var(--font-body);font-variant-numeric:tabular-nums;letter-spacing:.03em;color:var(--faint)}
.nm{font:600 11px/1.2 var(--font-body);color:var(--ink)}
.note{font:400 11px/1.5 var(--font-body);color:var(--faint)}
.tok{font:400 11px/1 var(--font-body);color:var(--faint);letter-spacing:.02em}
</style></head><body><div class="row" style="align-items:center;gap:14px">
<div style="display:grid;gap:6px;justify-items:center;flex:1"><div style="width:100%;height:48px;background:var(--accent-wash);border:1px dashed color-mix(in srgb,var(--accent) 50%,transparent);border-radius:var(--radius-sm)"></div><span class="nm">--tap-min 48px</span><span class="hex">every button, chip and icon</span></div><div style="display:grid;gap:6px;justify-items:center;flex:1"><div style="width:100%;height:56px;background:var(--accent-wash);border:1px dashed color-mix(in srgb,var(--accent) 50%,transparent);border-radius:var(--radius-sm)"></div><span class="nm">--tap-comfort 56px</span><span class="hex">list rows, switches, choices</span></div><div style="display:grid;gap:6px;justify-items:center;flex:1"><div style="width:100%;height:64px;background:var(--accent-wash);border:1px dashed color-mix(in srgb,var(--accent) 50%,transparent);border-radius:var(--radius-sm)"></div><span class="nm">--tabbar-h 64px</span><span class="hex">the tab bar</span></div><div style="display:grid;gap:6px;justify-items:center;flex:1"><div style="width:100%;height:56px;background:var(--accent-wash);border:1px dashed color-mix(in srgb,var(--accent) 50%,transparent);border-radius:var(--radius-sm)"></div><span class="nm">--appbar-h 56px</span><span class="hex">the app bar</span></div>
</div></body></html>
