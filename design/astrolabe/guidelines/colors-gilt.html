<!-- @dsCard group="Colors" viewport="700x160" name="Gilt — the brand layer" subtitle="Sampled from her artwork: the cloak\u2019s edge-line and its scattered stars." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--page);font-family:var(--font-body)}
.row{display:flex;gap:10px;flex-wrap:wrap}.col{display:grid;gap:10px}
.sw{border-radius:var(--radius-sm);border:1px solid var(--line);padding:10px;display:grid;gap:4px;min-width:96px;flex:1}
.hex{font:400 11px/1 var(--font-body);font-variant-numeric:tabular-nums;letter-spacing:.03em;color:var(--faint)}
.nm{font:600 11px/1.2 var(--font-body);color:var(--ink)}
.note{font:400 11px/1.5 var(--font-body);color:var(--faint)}
.tok{font:400 11px/1 var(--font-body);color:var(--faint);letter-spacing:.02em}
</style></head><body><div class="row">
<div class="sw" style="background:#C9A15B"><span class="nm" style="color:#241E13">--gilt</span><span class="hex" style="color:#241E13;opacity:.8">#C9A15B</span><span class="hex" style="color:#241E13;opacity:.65">hems, rules, offers · 7.8:1 on page</span></div>
<div class="sw" style="background:#E0BE7E"><span class="nm" style="color:#241E13">--gilt-bright</span><span class="hex" style="color:#241E13;opacity:.8">#E0BE7E</span><span class="hex" style="color:#241E13;opacity:.65">star fill, lit limb</span></div>
<div class="sw" style="background:#7A6238"><span class="nm" style="color:#E9E6F0">--gilt-dim</span><span class="hex" style="color:#E9E6F0;opacity:.8">#7A6238</span><span class="hex" style="color:#E9E6F0;opacity:.65">hairlines only — never text</span></div>
<div class="sw" style="background:#241E13"><span class="nm" style="color:#C9A15B">--gilt-wash</span><span class="hex" style="color:#C9A15B;opacity:.8">#241E13</span><span class="hex" style="color:#C9A15B;opacity:.65">the offer card</span></div>
</div><div class="row" style="margin-top:10px">
<div class="sw" style="background:#3E4A6B"><span class="nm" style="color:#E9E6F0">--cloth</span><span class="hex" style="color:#E9E6F0;opacity:.8">#3E4A6B</span><span class="hex" style="color:#E9E6F0;opacity:.65">the cloak</span></div>
<div class="sw" style="background:#2B3450"><span class="nm" style="color:#E9E6F0">--cloth-deep</span><span class="hex" style="color:#E9E6F0;opacity:.8">#2B3450</span><span class="hex" style="color:#E9E6F0;opacity:.65">the cloak in shadow</span></div>
<div class="sw" style="background:#EDE4CE"><span class="nm" style="color:#2B3450">--parchment</span><span class="hex" style="color:#2B3450;opacity:.8">#EDE4CE</span><span class="hex" style="color:#2B3450;opacity:.65">card stock — print and share images only</span></div>
</div></body></html>
