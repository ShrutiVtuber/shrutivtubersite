<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--page);font-family:var(--font-body)}

.sw{border-radius:var(--radius-sm);border:1px solid var(--line);padding:10px;display:grid;gap:4px;min-width:96px;flex:1}
.hex{font:400 11px/1 var(--font-body);font-variant-numeric:tabular-nums;letter-spacing:.03em;color:var(--faint)}
.nm{font:600 11px/1.2 var(--font-body);color:var(--ink)}
.note{font:400 11px/1.5 var(--font-body);color:var(--faint)}
.tok{font:400 11px/1 var(--font-body);color:var(--faint);letter-spacing:.02em}
</style></head><body><div class="row" style="align-items:flex-end;gap:8px">

city:.6">-7</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:40px;height:40px;background:var(--accent-wash);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:3px"></div><span class="hex">40</span><span class="hex" style="opacity:.6">-8</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:56px;height:56px;background:var(--accent-wash);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:3px"></div><span class="hex">56</span><span class="hex" style="opacity:.6">-9</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:72px;height:72px;background:var(--accent-wash);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:3px"></div><span class="hex">72</span><span class="hex" style="opacity:.6">-10</span></div>
</div><p class="note" style="margin:12px 0 0">--gutter 16 on reading screens · --gutter-dense 12 on Sky, Chart and the ephemeris.</p></body></html>
