<!-- @dsCard group="Colors" viewport="700x150" name="Rose and live" subtitle="Rose marks retrogrades and editorial. Live belongs to the stream dot alone." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--page);font-family:var(--font-body)}
.row{display:flex;gap:10px;flex-wrap:wrap}.col{display:grid;gap:10px}
.sw{border-radius:var(--radius-sm);border:1px solid var(--line);padding:10px;display:grid;gap:4px;min-width:96px;flex:1}
.hex{font:400 11px/1 var(--font-body);font-variant-numeric:tabular-nums;letter-spacing:.03em;color:var(--faint)}
.nm{font:600 11px/1.2 var(--font-body);color:var(--ink)}
.note{font:400 11px/1.5 var(--font-body);color:var(--faint)}
.tok{font:400 11px/1 var(--font-body);color:var(--faint);letter-spacing:.02em}
</style></head><body><div class="row">
<div class="sw" style="background:#E0A4BC"><span class="nm" style="color:#2C2338">--rose</span><span class="hex" style="color:#2C2338;opacity:.8">#E0A4BC</span><span class="hex" style="color:#2C2338;opacity:.65">retrograde ℞, editorial</span></div>
<div class="sw" style="background:#2C2338"><span class="nm" style="color:#E0A4BC">--rose-wash</span><span class="hex" style="color:#E0A4BC;opacity:.8">#2C2338</span><span class="hex" style="color:#E0A4BC;opacity:.65">caution card</span></div>
<div class="sw" style="background:#F07A8C"><span class="nm" style="color:#33202B">--live</span><span class="hex" style="color:#33202B;opacity:.8">#F07A8C</span><span class="hex" style="color:#33202B;opacity:.65">the stream dot, only</span></div>
<div class="sw" style="background:#33202B"><span class="nm" style="color:#F07A8C">--live-wash</span><span class="hex" style="color:#F07A8C;opacity:.8">#33202B</span><span class="hex" style="color:#F07A8C;opacity:.65">the live banner</span></div>
</div><p class="note" style="margin:10px 0 0">℞ is printed as well as tinted — the mark survives print, being read aloud, and colour blindness.</p></body></html>
