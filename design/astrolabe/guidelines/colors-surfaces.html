<!-- @dsCard group="Colors" viewport="700x140" name="Surfaces" subtitle="Four depths of night. Deliberately not black." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--page);font-family:var(--font-body)}
.row{display:flex;gap:10px;flex-wrap:wrap}.col{display:grid;gap:10px}
.sw{border-radius:var(--radius-sm);border:1px solid var(--line);padding:10px;display:grid;gap:4px;min-width:96px;flex:1}
.hex{font:400 11px/1 var(--font-body);font-variant-numeric:tabular-nums;letter-spacing:.03em;color:var(--faint)}
.nm{font:600 11px/1.2 var(--font-body);color:var(--ink)}
.note{font:400 11px/1.5 var(--font-body);color:var(--faint)}
.tok{font:400 11px/1 var(--font-body);color:var(--faint);letter-spacing:.02em}
</style></head><body><div class="row">
<div class="sw" style="background:#121829"><span class="nm" style="color:#E9E6F0">--page</span><span class="hex" style="color:#E9E6F0;opacity:.8">#121829</span><span class="hex" style="color:#E9E6F0;opacity:.65">the scaffold</span></div>
<div class="sw" style="background:#1A2138"><span class="nm" style="color:#E9E6F0">--card</span><span class="hex" style="color:#E9E6F0;opacity:.8">#1A2138</span><span class="hex" style="color:#E9E6F0;opacity:.65">raised</span></div>
<div class="sw" style="background:#232C48"><span class="nm" style="color:#E9E6F0">--veil</span><span class="hex" style="color:#E9E6F0;opacity:.8">#232C48</span><span class="hex" style="color:#E9E6F0;opacity:.65">pressed / sheet</span></div>
<div class="sw" style="background:#0D1220"><span class="nm" style="color:#B3B9D2">--inset</span><span class="hex" style="color:#B3B9D2;opacity:.8">#0D1220</span><span class="hex" style="color:#B3B9D2;opacity:.65">wells, tables</span></div>
</div></body></html>
