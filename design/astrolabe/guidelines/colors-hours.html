<!-- @dsCard group="Colors" viewport="700x150" name="The ruling hour" subtitle="Seven tints, one per planetary ruler. They colour a hem and a chip, nothing else." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--page);font-family:var(--font-body)}
.row{display:flex;gap:10px;flex-wrap:wrap}.col{display:grid;gap:10px}
.sw{border-radius:var(--radius-sm);border:1px solid var(--line);padding:10px;display:grid;gap:4px;min-width:96px;flex:1}
.hex{font:400 11px/1 var(--font-body);font-variant-numeric:tabular-nums;letter-spacing:.03em;color:var(--faint)}
.nm{font:600 11px/1.2 var(--font-body);color:var(--ink)}
.note{font:400 11px/1.5 var(--font-body);color:var(--faint)}
.tok{font:400 11px/1 var(--font-body);color:var(--faint);letter-spacing:.02em}
</style></head><body><div class="row">
<div class="sw" style="background:#C9A15B"><span class="nm" style="color:#241E13">☉ sun</span><span class="hex" style="color:#241E13;opacity:.8">#C9A15B</span></div>
<div class="sw" style="background:#B9C2DA"><span class="nm" style="color:#1B2135">☾ moon</span><span class="hex" style="color:#1B2135;opacity:.8">#B9C2DA</span></div>
<div class="sw" style="background:#D08A7C"><span class="nm" style="color:#2A1B1A">♂ mars</span><span class="hex" style="color:#2A1B1A;opacity:.8">#D08A7C</span></div>
<div class="sw" style="background:#8FBEE8"><span class="nm" style="color:#1D2A45">☿ mercury</span><span class="hex" style="color:#1D2A45;opacity:.8">#8FBEE8</span></div>
<div class="sw" style="background:#9FC2A8"><span class="nm" style="color:#1A2620">♃ jupiter</span><span class="hex" style="color:#1A2620;opacity:.8">#9FC2A8</span></div>
<div class="sw" style="background:#E0A4BC"><span class="nm" style="color:#2C2338">♀ venus</span><span class="hex" style="color:#2C2338;opacity:.8">#E0A4BC</span></div>
<div class="sw" style="background:#8B93AF"><span class="nm" style="color:#1E2233">♄ saturn</span><span class="hex" style="color:#1E2233;opacity:.8">#8B93AF</span></div>
</div><p class="note" style="margin:10px 0 0">Never tint a reference table. A practitioner\u2019s figures must not change colour every sixty-odd minutes.</p></body></html>
