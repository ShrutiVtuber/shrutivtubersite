<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--page);font-family:var(--font-body)}
.row{display:flex;gap:10px;flex-wrap:wrap}.col{display:grid;gap:10px}
.sw{border-radius:var(--radius-sm);border:1px solid var(--line);padding:10px;display:grid;gap:4px;min-width:96px;flex:1}
.hex{font:400 11px/1 var(--font-body);font-variant-numeric:tabular-nums;letter-spacing:.03em;color:var(--faint)}
.nm{font:600 11px/1.2 var(--font-body);color:var(--ink)}
.note{font:400 11px/1.5 var(--font-body);color:var(--faint)}
.tok{font:400 11px/1 var(--font-body);color:var(--faint);letter-spacing:.02em}
</style></head><body><div class="row">
<div style="display:grid;gap:6px;justify-items:center;flex:1"><div style="width:100%;height:44px;background:var(--card);border:1px solid var(--line);border-radius:8px"></div><span class="nm">8px</span><span class="hex">chips, buttons, inputs</span></div><div style="display:grid;gap:6px;justify-items:center;flex:1"><div style="width:100%;height:44px;background:var(--card);border:1px solid var(--line);border-radius:14px"></div><span class="nm">14px</span><span class="hex">cards, list groups</span></div><div style="display:grid;gap:6px;justify-items:center;flex:1"><div style="width:100%;height:44px;background:var(--card);border:1px solid var(--line);border-radius:20px"></div><span class="nm">20px</span><span class="hex">the plate, dialogs</span></div><div style="display:grid;gap:6px;justify-items:center;flex:1"><div style="width:100%;height:44px;background:var(--card);border:1px solid var(--line);border-radius:28px"></div><span class="nm">28px</span><span class="hex">bottom sheets</span></div><div style="display:grid;gap:6px;justify-items:center;flex:1"><div style="width:100%;height:44px;background:var(--card);border:1px solid var(--line);border-radius:999px"></div><span class="nm">999px</span><span class="hex">pills, the live dot</span></div>
</div></body></html>
