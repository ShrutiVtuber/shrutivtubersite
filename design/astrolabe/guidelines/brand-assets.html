<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--page);font-family:var(--font-body)}
.row{display:flex;gap:10px;flex-wrap:wrap}.col{display:grid;gap:10px}
.sw{border-radius:var(--radius-sm);border:1px solid var(--line);padding:10px;display:grid;gap:4px;min-width:96px;flex:1}
.hex{font:400 11px/1 var(--font-body);font-variant-numeric:tabular-nums;letter-spacing:.03em;color:var(--faint)}
.nm{font:600 11px/1.2 var(--font-body);color:var(--ink)}
.note{font:400 11px/1.5 var(--font-body);color:var(--faint)}
.tok{font:400 11px/1 var(--font-body);color:var(--faint);letter-spacing:.02em}
</style></head><body><div class="row" style="align-items:center;gap:18px">
<div style="display:grid;gap:6px;justify-items:center"><img src="../assets/wordmark-small.png" alt="Shruti VTuber wordmark" style="height:52px"><span class="hex">wordmark-small.png · 500×180</span></div>
<div style="display:grid;gap:6px;justify-items:center"><img src="../assets/avatar-square.png" alt="Chibi avatar" style="height:72px;border-radius:var(--radius-md);border:1px solid var(--line)"><span class="hex">avatar-square.png · 512×512</span></div>
<div style="display:grid;gap:6px;justify-items:center"><img src="../assets/icon-192.png" alt="App icon" style="height:56px;border-radius:12px"><span class="hex">icon-192.png</span></div>
<p class="note" style="flex:1;min-width:200px;margin:0">The wordmark is pink-and-blue on transparent, from the WordPress era. It does not sit on #121829. Never redraw it — render “Astrolabe” in EB Garamond where a mark is needed, until she re-cuts it.</p>
</div></body></html>
