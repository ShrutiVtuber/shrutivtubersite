<!-- @dsCard group="Colors" viewport="700x140" name="Ink" subtitle="Three weights of text, with their contrast on --page." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--page);font-family:var(--font-body)}
.row{display:flex;gap:10px;flex-wrap:wrap}.col{display:grid;gap:10px}
.sw{border-radius:var(--radius-sm);border:1px solid var(--line);padding:10px;display:grid;gap:4px;min-width:96px;flex:1}
.hex{font:400 11px/1 var(--font-body);font-variant-numeric:tabular-nums;letter-spacing:.03em;color:var(--faint)}
.nm{font:600 11px/1.2 var(--font-body);color:var(--ink)}
.note{font:400 11px/1.5 var(--font-body);color:var(--faint)}
.tok{font:400 11px/1 var(--font-body);color:var(--faint);letter-spacing:.02em}
</style></head><body><div class="row">
<div class="sw" style="background:var(--card)"><span style="font:600 15px/1.2 var(--font-body);color:#E9E6F0">--ink</span><span class="hex">#E9E6F0 · 14.6:1</span><span class="hex">titles, figures, answers</span></div>
<div class="sw" style="background:var(--card)"><span style="font:600 15px/1.2 var(--font-body);color:#B3B9D2">--soft</span><span class="hex">#B3B9D2 · 9.0:1</span><span class="hex">body, secondary</span></div>
<div class="sw" style="background:var(--card)"><span style="font:600 15px/1.2 var(--font-body);color:#8B93AF">--faint</span><span class="hex">#8B93AF · 5.4:1</span><span class="hex">captions, column heads, disabled</span></div>
</div></body></html>
