<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:22px 28px;display:grid;gap:16px}.row{display:flex;gap:22px;align-items:baseline}.g{font-family:var(--font-display);font-size:30px;color:var(--ink)}.k{font-family:var(--font-body);font-size:11px;color:var(--ink-faint);min-width:118px}.use{font-family:var(--font-body);font-size:12.5px;color:var(--ink-soft)}</style></head><body>
<div class="row"><span class="k">Luminaries</span><span class="g">☉ ☾ ☽</span><span class="use">journal markers, planetary hours</span></div>
<div class="row"><span class="k">Planets</span><span class="g">☿ ♀ ♂ ♃ ♄</span><span class="use">ephemeris data, schedule accents</span></div>
<div class="row"><span class="k">Moon phases</span><span class="g">○ ◐ ● ◑</span><span class="use">calendar, empty states</span></div>
<div class="row"><span class="k">Punctuation</span><span class="g">∴ · ⁂ §</span><span class="use">seals, section breaks, legal anchors</span></div>
</body></html>
