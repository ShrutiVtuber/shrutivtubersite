<!-- @dsCard group="Brand" viewport="700x240" name="Iconography" subtitle="Lucide (CDN, 1.5px stroke) for UI · Simple Icons for platforms — flagged substitution" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:22px 28px;display:grid;gap:18px}.row{display:flex;gap:20px;align-items:center}.k{font-family:var(--font-body);font-size:11px;color:var(--ink-faint);min-width:118px}.row i,.row svg{color:var(--ink-soft)}img.si{width:20px;height:20px;display:block}</style></head><body>
<div class="row"><span class="k">UI · Lucide</span>
<i data-lucide="calendar-days"></i><i data-lucide="clock-3"></i><i data-lucide="play"></i><i data-lucide="external-link"></i><i data-lucide="globe"></i><i data-lucide="moon-star"></i><i data-lucide="download"></i><i data-lucide="arrow-right"></i><i data-lucide="check"></i><i data-lucide="x"></i><i data-lucide="chevron-down"></i><i data-lucide="mail"></i></div>
<div class="row"><span class="k">Platforms · Simple Icons</span>
<img class="si" src="https://cdn.simpleicons.org/twitch/4A5470" alt="Twitch"><img class="si" src="https://cdn.simpleicons.org/youtube/4A5470" alt="YouTube"><img class="si" src="https://cdn.simpleicons.org/discord/4A5470" alt="Discord"><img class="si" src="https://cdn.simpleicons.org/x/4A5470" alt="X"><img class="si" src="https://cdn.simpleicons.org/github/4A5470" alt="GitHub"><img class="si" src="https://cdn.simpleicons.org/kofi/4A5470" alt="Ko-fi"></div>
<div class="row"><span class="k">Rules</span><span style="font-family:var(--font-body);font-size:12.5px;color:var(--ink-soft)">16–20px · stroke 1.5 · currentColor · label every icon · never emoji</span></div>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script><script>lucide.createIcons({attrs:{width:20,height:20,'stroke-width':1.5}})</script>
</body></html>
