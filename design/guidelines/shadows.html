<!-- @dsCard group="Spacing" viewport="700x210" name="Elevation" subtitle="Shadow is reserved for floating layers" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:26px 28px;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.c{background:var(--surface-card);border:1px solid var(--line);border-radius:var(--radius-md);height:110px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px}.t{font-family:var(--font-body);font-size:12.5px;font-weight:600;color:var(--ink)}.s{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint)}</style></head><body>
<div class="c" style="box-shadow:var(--shadow-1)"><span class="t">Resting card</span><span class="s">--shadow-1</span></div>
<div class="c" style="box-shadow:var(--shadow-2);border-color:var(--line-strong)"><span class="t">Hover</span><span class="s">--shadow-2 + line-strong</span></div>
<div class="c" style="box-shadow:var(--shadow-3);border-radius:var(--radius-lg)"><span class="t">Floating — modal, toast, menu</span><span class="s">--shadow-3</span></div>
</body></html>
