<!-- @dsCard group="Colors" viewport="700x230" name="Dawn — light theme" subtitle="Surfaces and ink at first light" -->
<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;display:grid;grid-template-columns:repeat(7,1fr);gap:10px}.sw{border-radius:var(--radius-sm);border:1px solid var(--line);height:92px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px}.n{font-family:var(--font-mono);font-size:9.5px;color:var(--ink-faint)}.t{font-family:var(--font-body);font-size:11.5px;font-weight:600;color:var(--ink)}</style></head><body>
<div class="sw" style="background:var(--surface-page)"><span class="t">page</span><span class="n">#F8F6F3</span></div>
<div class="sw" style="background:var(--surface-card)"><span class="t">card</span><span class="n">#FFFFFF</span></div>
<div class="sw" style="background:var(--surface-veil)"><span class="t">veil</span><span class="n">#F1ECEF</span></div>
<div class="sw" style="background:var(--surface-inset)"><span class="t">inset</span><span class="n">#ECE7EB</span></div>
<div class="sw" style="background:var(--ink)"><span class="t" style="color:#fff">ink</span><span class="n" style="color:#ffffffaa">#26304A</span></div>
<div class="sw" style="background:var(--ink-soft)"><span class="t" style="color:#fff">ink-soft</span><span class="n" style="color:#ffffffaa">#4A5470</span></div>
<div class="sw" style="background:var(--ink-faint)"><span class="t" style="color:#fff">ink-faint</span><span class="n" style="color:#ffffffaa">#6E7890</span></div>
</body></html>
