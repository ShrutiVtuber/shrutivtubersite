<!-- @dsCard group="Spacing" viewport="700x220" name="Radii & hairlines" subtitle="4 controls · 10 cards · 16 panels · pill — 1px lines do the work" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:22px 28px;display:flex;gap:16px;align-items:flex-end}.chip{background:var(--surface-card);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft)}.lbl{font-family:var(--font-body);font-size:11px;color:var(--ink-faint);text-align:center;margin-top:8px}</style></head><body>
<div><div class="chip" style="width:110px;height:110px;border-radius:var(--radius-sm)">4px</div><div class="lbl">controls</div></div>
<div><div class="chip" style="width:110px;height:110px;border-radius:var(--radius-md)">10px</div><div class="lbl">cards</div></div>
<div><div class="chip" style="width:110px;height:110px;border-radius:var(--radius-lg)">16px</div><div class="lbl">panels · modals</div></div>
<div><div class="chip" style="width:130px;height:44px;border-radius:var(--radius-full)">pill</div><div class="lbl">badges · seals</div></div>
<div style="flex:1"><div style="border-top:1px solid var(--line);padding-top:6px" class="lbl">--line</div><div style="border-top:1px solid var(--line-strong);padding-top:6px;margin-top:14px" class="lbl">--line-strong (hover)</div><div style="border-top:1px solid var(--horizon-line);padding-top:6px;margin-top:14px" class="lbl">--horizon-line</div></div>
</body></html>
