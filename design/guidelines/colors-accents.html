<!-- @dsCard group="Colors" viewport="700x300" name="Accents & signals" subtitle="Blue is interactive · rose is editorial · red means live — both hours" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>.half{padding:16px 24px;background:var(--surface-page);display:grid;grid-template-columns:64px repeat(6,1fr);gap:8px;align-items:center}.lbl{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint)}.sw{height:56px;border-radius:var(--radius-sm);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end;padding:6px}.t{font-family:var(--font-body);font-size:10.5px;font-weight:600}</style></head><body style="margin:0">
<div class="half" data-theme="light"><span class="lbl">DAWN</span>
<div class="sw" style="background:var(--accent)"><span class="t" style="color:var(--on-accent)">accent</span></div>
<div class="sw" style="background:var(--accent-hover)"><span class="t" style="color:#fff">hover</span></div>
<div class="sw" style="background:var(--accent-wash)"><span class="t" style="color:var(--accent)">wash</span></div>
<div class="sw" style="background:var(--rose)"><span class="t" style="color:#fff">rose</span></div>
<div class="sw" style="background:var(--rose-wash)"><span class="t" style="color:var(--rose)">wash</span></div>
<div class="sw" style="background:var(--live)"><span class="t" style="color:#fff">live</span></div></div>
<div class="half" data-theme="dark"><span class="lbl">DUSK</span>
<div class="sw" style="background:var(--accent)"><span class="t" style="color:var(--on-accent)">accent</span></div>
<div class="sw" style="background:var(--accent-hover)"><span class="t" style="color:#10182B">hover</span></div>
<div class="sw" style="background:var(--accent-wash)"><span class="t" style="color:var(--accent)">wash</span></div>
<div class="sw" style="background:var(--rose)"><span class="t" style="color:#10182B">rose</span></div>
<div class="sw" style="background:var(--rose-wash)"><span class="t" style="color:var(--rose)">wash</span></div>
<div class="sw" style="background:var(--live)"><span class="t" style="color:#10182B">live</span></div></div>
</body></html>
