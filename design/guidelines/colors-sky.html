<!-- @dsCard group="Colors" viewport="700x260" name="The sky" subtitle="One gradient, two hours — zenith to rose horizon, closed by a 1px line" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;display:grid;grid-template-columns:1fr 1fr}.pane{padding:0;background:var(--surface-page)}.cap{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);padding:8px 16px;display:flex;justify-content:space-between}</style></head><body>
<div class="pane" data-theme="light"><div class="sky" style="height:190px"><div class="sky-stars"></div><div style="position:absolute;bottom:14px;left:16px" class="t-eyebrow">Dawn · 06:41 EEST</div><div class="sky-horizon"></div></div><div class="cap"><span>--sky-zenith #A9CDEC</span><span>--sky-horizon #F2DCD9</span></div></div>
<div class="pane" data-theme="dark"><div class="sky" style="height:190px"><div class="sky-stars"></div><div style="position:absolute;bottom:14px;left:16px" class="t-eyebrow">Dusk · 20:27 EEST</div><div class="sky-horizon"></div></div><div class="cap"><span>--sky-zenith #0B1322</span><span>--sky-horizon #6E5470</span></div></div>
</body></html>
