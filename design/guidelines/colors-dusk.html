<!-- @dsCard group="Colors" viewport="700x230" name="Dusk — dark theme" subtitle="The same sky after sunset" -->
<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px 24px;display:grid;grid-template-columns:repeat(7,1fr);gap:10px}.sw{border-radius:var(--radius-sm);border:1px solid var(--line);height:92px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px}.n{font-family:var(--font-mono);font-size:9.5px;color:var(--ink-faint)}.t{font-family:var(--font-body);font-size:11.5px;font-weight:600;color:var(--ink)}</style></head><body>
<div class="sw" style="background:var(--surface-page)"><span class="t">page</span><span class="n">#121829</span></div>
<div class="sw" style="background:var(--surface-card)"><span class="t">card</span><span class="n">#1A2138</span></div>
<div class="sw" style="background:var(--surface-veil)"><span class="t">veil</span><span class="n">#232C48</span></div>
<div class="sw" style="background:var(--surface-inset)"><span class="t">inset</span><span class="n">#0D1220</span></div>
<div class="sw" style="background:var(--ink)"><span class="t" style="color:#26304A">ink</span><span class="n" style="color:#26304Aaa">#E9E6F0</span></div>
<div class="sw" style="background:var(--ink-soft)"><span class="t" style="color:#121829">ink-soft</span><span class="n" style="color:#121829aa">#B3B9D2</span></div>
<div class="sw" style="background:var(--ink-faint)"><span class="t" style="color:#121829">ink-faint</span><span class="n" style="color:#121829aa">#8B93AF</span></div>
</body></html>
