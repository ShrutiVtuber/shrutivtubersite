# ─────────────────────────────────────────────────────────────────────────────
# shrutivtuber.com — base compose stack
#
# Runs alongside theourgia on the same host but shares NOTHING with it:
# its own postgres, its own volumes, its own network, its own deploy root.
# The only shared resource is the host Caddy, which routes by hostname.
#
#   host Caddy :443  ──►  127.0.0.1:${SHRUTI_HOST_PORT:-8200}  ──►  caddy
#                                                                    ├─► site  (Astro SSR)
#                                                                    └─► backend (FastAPI)
#
# Production overlay (resource limits, log rotation) lives in
# docker-compose.prod.yml — always deploy with BOTH files.
# ─────────────────────────────────────────────────────────────────────────────

name: shruti

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [backend]
    environment:
      # Read by the internal Caddyfile: "1" proxies to the Astro site, anything
      # else serves the unbuilt placeholder. Caddy resolves {env.*} at start,
      # so changing this needs a restart, not a reload.
      SHRUTI_WEB_ENABLED: ${SHRUTI_WEB_ENABLED:-0}
    ports:
      # Loopback only. TLS is the host Caddy's job.
      - "127.0.0.1:${SHRUTI_HOST_PORT:-8200}:8080"
    volumes:
      - ./Caddyfile.internal:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - journal:/srv/journal:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [shruti, shruti-interop]

  # Parked behind the "web" profile until the Astro site exists. A plain
  # `docker compose up` brings up postgres, backend and caddy only, so the API
  # can deploy before there is anything to look at.
  site:
    profiles: ["web"]
    build:
      # The workspace root, so the shared token package and the lockfile
      # resolve. A ./frontend context cannot see either.
      context: .
      dockerfile: frontend/site/Dockerfile
      target: prod
    restart: unless-stopped
    depends_on: [backend]
    environment:
      # Server-side fetches talk to the backends over the internal networks —
      # never from the browser, so no secret and no CORS surface.
      SHRUTI_API_INTERNAL: http://backend:8000
      SHRUTI_ASTRO_INTERNAL: http://shruti-astro:8000
      SHRUTI_SITE_URL: ${SHRUTI_SITE_URL:-http://localhost:8200}
      HOST: 0.0.0.0
      PORT: 4321
      # Where the beeranked agent's synced pages land, for the /journal routes.
      SHRUTI_JOURNAL_DIR: /srv/journal
    volumes:
      # Written by the agent, read here. The journal renders inside the site's
      # own layout rather than being served as loose files, so the section gets
      # the REAL header and footer rather than a copy of them.
      - journal:/srv/journal:ro
    networks: [shruti, shruti-interop]


  # ── BeeRanked content agent ────────────────────────────────────────────────
  #
  # Outbound-only. It polls BeeRanked for published content and writes it as
  # ready-to-serve static files into a volume; nothing reaches in, and there is
  # no per-request dependency on their service — if it stops, /journal keeps
  # serving the last sync.
  #
  # Behind the `web` profile because it is part of the public site, not the API.
  beeranked:
    profiles: ["web"]
    image: beeranked/agent
    restart: unless-stopped
    environment:
      BEERANKED_KEY: ${SHRUTI_BEERANKED_KEY:?the connector key from setup_self_host_install}
      BEERANKED_ENDPOINT: ${SHRUTI_BEERANKED_ENDPOINT:-https://studio.beeranked.online/api/agent}
      BEERANKED_PATH: /journal
    volumes:
      - journal:/out
    networks: [shruti]

  # There is no `admin` service. The admin was specified as a separate React
  # SPA built into a volume that caddy served at /admin, and it was never
  # written — nothing under frontend/admin is tracked, so its build context
  # did not exist and `--profile web` could not come up at all. It is Astro
  # pages inside `site` now, which caddy already routes /admin* to.

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: [.env]
    environment:
      # Where to ask what the sky was doing, for journal entries.
      SHRUTI_ASTRO_INTERNAL: http://shruti-astro:8000
      # The synced pages, read to find when each entry was published. Read-only
      # — the backend is a reader here, the agent owns the volume.
      SHRUTI_JOURNAL_DIR: /srv/journal
      SHRUTI_DATABASE_URL: postgresql+asyncpg://${SHRUTI_POSTGRES_USER:-shruti}:${SHRUTI_POSTGRES_PASSWORD}@postgres:5432/${SHRUTI_POSTGRES_DB:-shruti}
    volumes:
      - media:/app/media
      - journal:/srv/journal:ro
    networks: [shruti, shruti-interop]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SHRUTI_POSTGRES_USER:-shruti}
      POSTGRES_PASSWORD: ${SHRUTI_POSTGRES_PASSWORD}
      POSTGRES_DB: ${SHRUTI_POSTGRES_DB:-shruti}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SHRUTI_POSTGRES_USER:-shruti} -d ${SHRUTI_POSTGRES_DB:-shruti}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [shruti]

  # vcordbot — the Discord bot, and deliberately just a web service.
  #
  # Behind its own profile so an ordinary `up` does not start it: it is a
  # separate product that happens to share a box, and the website must not
  # depend on it in either direction.
  #
  # It reaches the ephemeris over the interop network and holds NO credential
  # for the website — not a token it must not misuse, but none to misuse.
  bot:
    profiles: ["bot"]
    build:
      context: ./bot
      target: prod
    restart: unless-stopped
    env_file: [.env]
    environment:
      SHRUTI_ASTRO_INTERNAL: http://shruti-astro:8000
      SHRUTI_SITE_URL: ${SHRUTI_SITE_URL:-https://shrutivtuber.com}
      VCORDBOT_URL: ${VCORDBOT_URL:-https://bot.shrutivtuber.com}
    ports:
      # Bound to loopback: Caddy terminates TLS and proxies. Discord must reach
      # it over HTTPS with a valid certificate, so it is never exposed directly.
      - "127.0.0.1:8250:8000"
    volumes:
      # Its own database, on its own volume — not a schema beside the site's.
      # The bot having no route to site data is easier to guarantee when there
      # is no shared server to be wrong about.
      - bot_data:/data
    networks: [shruti, shruti-interop]

volumes:
  # Written by the beeranked agent, read by caddy. One direction only.
  journal:
  bot_data:
  postgres_data:
  media:
  caddy_data:
  caddy_config:

networks:
  shruti:
    name: shruti
  # Shared with the shruti-astro stack so Caddy can reach the daemon by name.
  # Created out of band: docker network create shruti-interop
  shruti-interop:
    external: true
